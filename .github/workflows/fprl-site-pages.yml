name: Deploy FPRL site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-pages-setup-maos3q
    paths:
      - 'fprl-site/**'
      - '.github/workflows/fprl-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fprl-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
