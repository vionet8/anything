<title>キャラクタープロトタイプ</title>
<style>
  :root {
    --bg: #0c0e14;
    --panel: #161922;
    --panel-border: #2a3040;
    --text: #e8ebf2;
    --text-dim: #8b93a7;
    --accent: #ffb454;
    --state-idle: #8b93a7;
    --state-walk: #7ee787;
    --state-run: #ff8a5c;
    --state-wave: #ffd166;
    --state-crouch: #7ec8e3;
    --state-jump: #c792ea;
    --state-peace: #ff8fab;
    --state-double-peace: #ff5c8a;
    --state-dance: #6ee7d6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    color: var(--text);
  }

  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
    max-width: min(320px, calc(100vw - 32px));
  }

  .hud::before,
  .hud::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--accent);
    opacity: 0.8;
  }
  .hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .hud-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }

  .hud-title {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  /* Close / reopen. Sized for a thumb rather than a cursor -- the panel covers
     a third of a phone screen, which is where closing it actually matters. */
  .hud-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    font: inherit;
    font-size: 18px;
    line-height: 1;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .hud-button:hover { color: var(--text); border-color: var(--accent); }

  .hud-head .hud-button { margin: -6px -8px -6px 0; }

  #hud-open {
    position: fixed;
    top: 16px;
    left: 16px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(6px);
    font-size: 15px;
  }

  [hidden] { display: none !important; }

  .keys {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .keycap {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 2px 6px;
    line-height: 1.4;
  }

  .keys-label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--panel-border);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  .status-key {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  #state-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--state-idle);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: color 0.15s ease;
  }
  #state-label[data-state="walk"] { color: var(--state-walk); }
  #state-label[data-state="run"] { color: var(--state-run); }
  #state-label[data-state="wave"] { color: var(--state-wave); }
  #state-label[data-state="crouch"] { color: var(--state-crouch); }
  #state-label[data-state="jump"] { color: var(--state-jump); }
  #state-label[data-state="peace"] { color: var(--state-peace); }
  #state-label[data-state="double-peace"] { color: var(--state-double-peace); }
  #state-label[data-state="dance"] { color: var(--state-dance); }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--bg);
    z-index: 10;
  }

  #touch-pad {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border: 1px solid var(--panel-border);
    display: none;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  @media (pointer: coarse) {
    #touch-pad { display: flex; }
  }

  @media (prefers-reduced-motion: reduce) {
    #state-label { transition: none; }
  }
</style>
<canvas id="scene"></canvas>
<div id="loading">MODEL LOADING…</div>
<div class="hud" id="hud">
  <div class="hud-head">
    <p class="hud-title">Controls</p>
    <button type="button" class="hud-button" id="hud-close" aria-label="操作パネルを閉じる" aria-controls="hud">×</button>
  </div>
  <div class="keys">
    <span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span>
    <span class="keys-label">移動</span>
  </div>
  <div class="keys">
    <span class="keycap">Shift</span>
    <span class="keys-label">ダッシュ</span>
  </div>
  <div class="keys">
    <span class="keycap">E</span>
    <span class="keys-label">手を振る</span>
  </div>
  <div class="keys">
    <span class="keycap">C</span>
    <span class="keys-label">屈伸</span>
  </div>
  <div class="keys">
    <span class="keycap">V</span>
    <span class="keys-label">ピース</span>
  </div>
  <div class="keys">
    <span class="keycap">B</span>
    <span class="keys-label">ダブルピース</span>
  </div>
  <div class="keys">
    <span class="keycap">R</span>
    <span class="keys-label">ダンス</span>
  </div>
  <div class="keys">
    <span class="keycap">Space</span>
    <span class="keys-label">ジャンプ</span>
  </div>
  <div class="keys">
    <span class="keycap">1</span><span class="keycap">2</span><span class="keycap">3</span><span class="keycap">4</span><span class="keycap">5</span><span class="keycap">6</span>
    <span class="keys-label">表情</span>
  </div>
  <div class="keys">
    <span class="keycap">Drag</span>
    <span class="keys-label">カメラ回転</span>
  </div>
  <div class="status-row">
    <span class="status-key">State</span>
    <span id="state-label" data-state="idle">idle</span>
  </div>
</div>
<button type="button" class="hud-button" id="hud-open" aria-label="操作パネルを開く" aria-controls="hud" hidden>☰</button>
<div id="touch-pad">HOLD<br />TO WALK</div>
<script>
  // Open/closed is remembered per viewer, so someone who closed the panel to
  // look at her does not get it back on every reload. Storage can throw
  // outright (private windows, blocked site data), hence the try/catch rather
  // than a null check -- the panel still works, it just forgets.
  (function () {
    var hud = document.getElementById('hud');
    var closeButton = document.getElementById('hud-close');
    var openButton = document.getElementById('hud-open');
    var KEY = 'hud-closed';

    function apply(closed, remember) {
      hud.hidden = closed;
      openButton.hidden = !closed;
      if (remember) {
        try { localStorage.setItem(KEY, closed ? '1' : '0'); } catch (e) { /* not fatal */ }
      }
    }

    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) { /* not fatal */ }
    apply(stored === '1', false);

    // Blur after clicking, or the button keeps keyboard focus and swallows the
    // space bar as "press me again" instead of letting her jump.
    closeButton.addEventListener('click', function () { apply(true, true); openButton.focus(); openButton.blur(); });
    openButton.addEventListener('click', function () { apply(false, true); closeButton.focus(); closeButton.blur(); });
  })();
</script>
