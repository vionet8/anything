<title>キャラクタープロトタイプ</title>
<style>
  :root {
    --bg: #0c0e14;
    --panel: #161922;
    --panel-border: #2a3040;
    --text: #e8ebf2;
    --text-dim: #8b93a7;
    --accent: #ffb454;
    --state-idle: #8b93a7;
    --state-walk: #7ee787;
    --state-run: #ff8a5c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    color: var(--text);
  }

  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
    max-width: min(320px, calc(100vw - 32px));
  }

  .hud::before,
  .hud::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--accent);
    opacity: 0.8;
  }
  .hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .hud-title {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  .keys {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .keycap {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 2px 6px;
    line-height: 1.4;
  }

  .keys-label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--panel-border);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  .status-key {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  #state-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--state-idle);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: color 0.15s ease;
  }
  #state-label[data-state="walk"] { color: var(--state-walk); }
  #state-label[data-state="run"] { color: var(--state-run); }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--bg);
    z-index: 10;
  }

  #touch-pad {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border: 1px solid var(--panel-border);
    display: none;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  @media (pointer: coarse) {
    #touch-pad { display: flex; }
  }

  @media (prefers-reduced-motion: reduce) {
    #state-label { transition: none; }
  }
</style>
<canvas id="scene"></canvas>
<div id="loading">MODEL LOADING…</div>
<div class="hud">
  <p class="hud-title">Controls</p>
  <div class="keys">
    <span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span>
    <span class="keys-label">移動</span>
  </div>
  <div class="keys">
    <span class="keycap">Shift</span>
    <span class="keys-label">ダッシュ</span>
  </div>
  <div class="status-row">
    <span class="status-key">State</span>
    <span id="state-label" data-state="idle">idle</span>
  </div>
</div>
<div id="touch-pad">HOLD<br />TO WALK</div>
<script>window.__MODEL_BASE64__ = "__MODEL_BASE64_PLACEHOLDER__";</script>
