<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Character Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #202030; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 10px; left: 10px; color: white;
    font-family: sans-serif; font-size: 14px; line-height: 1.5;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px;
  }
  /* Same per-state colour coding as the published artifact's HUD, so the
     dev page and the artifact read identically. */
  #anim-state { font-weight: 600; color: #8b93a7; }
  #anim-state[data-state="walk"] { color: #7ee787; }
  #anim-state[data-state="run"] { color: #ff8a5c; }
  #anim-state[data-state="wave"] { color: #ffd166; }
  #anim-state[data-state="crouch"] { color: #7ec8e3; }
  #anim-state[data-state="jump"] { color: #c792ea; }
  #anim-state[data-state="peace"] { color: #ff8fab; }
  #anim-state[data-state="double-peace"] { color: #ff5c8a; }
  #anim-state[data-state="dance"] { color: #6ee7d6; }
</style>
</head>
<body>
<div id="ui">
  <div>WASD / 矢印キーで移動、Shiftでダッシュ、Space: ジャンプ、ドラッグ: カメラ回転</div>
  <div class="pg-manual-hint">E: 手を振る、C: 屈伸、V: ピース、B: ダブルピース、R: ダンス</div>
  <div class="pg-manual-hint">1〜6: 表情（笑顔 / にっこり / 驚き / 怒り / 悲しい / &gt;_&lt;）</div>
  <div id="anim-state" data-state="idle">state: idle</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
  }
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
